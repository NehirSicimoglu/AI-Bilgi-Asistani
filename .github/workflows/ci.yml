name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: uv kurulumu
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bağımlılıklar
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testler
        # Testler ağsızdır (SQLite + in-memory Qdrant + fake sağlayıcılar);
        # gerçek altyapı testleri runner'daki Docker ile testcontainers üzerinden çalışır.
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + type + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint src

      - name: Tip kontrolü + build
        run: npm run build
