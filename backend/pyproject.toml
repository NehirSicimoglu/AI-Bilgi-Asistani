[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Production-ready AI Knowledge Assistant (RAG) backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "chardet>=7.4.3",
    "tiktoken>=0.13.0",
    "google-genai>=2.11.0",
    "tenacity>=9.1.4",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "prometheus-client>=0.25.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.22.1",
    "testcontainers>=4.14.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "evaluation"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Korpus üreticisi bir veri dosyasıdır; olgusal cümleleri sarmak okunurluğu bozar.
"scripts/build_corpus.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
